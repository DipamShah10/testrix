[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    live_api: makes real network calls to the Groq API (rate-limited, non-deterministic, costs real quota) — excluded from the default run per the project's "no external API calls in tests" design; run explicitly with `pytest -m live_api`.
addopts = -m "not live_api"
